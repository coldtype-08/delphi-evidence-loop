[project]
name = "nim-evidence-loop"
version = "0.1.0"
description = "Evidence-gated hypothesis loop on NVIDIA Nemotron: the model reads and quotes, code counts and verifies, a human signs before anything advances."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "httpx>=0.27",
    "jsonschema>=4.22",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[tool.uv]
package = false
